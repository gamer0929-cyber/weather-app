<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>天氣App</title>

<style>
body {
    background: #111;
    color: white;
    text-align: center;
}

.card {
    margin: 20px;
    padding: 20px;
    border: 2px solid #444;
}
</style>

</head>

<body>

<h1>🌤 天氣監控</h1>

{% for w in weather %}
<div class="card">
    <h2>{{w.location}}｜{{w.period}}</h2>
    <h1>🌧 {{w.rain}}%</h1>
    <h3>{{w.min_temp}} ~ {{w.max_temp}}°C</h3>
</div>
{% endfor %}

</body>
</html>
